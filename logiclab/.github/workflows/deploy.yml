name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Detect folder, install and build
        run: |
          if [ -d "claretlab" ]; then
            echo "Folder 'claretlab' detected."
            cd claretlab
            npm ci
            npm run build
            cd ..
            mv claretlab/dist ./dist
          elif [ -d "logiclab" ]; then
            echo "Folder 'logiclab' detected."
            cd logiclab
            npm ci
            npm run build
            cd ..
            mv logiclab/dist ./dist
          else
            echo "No subfolder detected, building from repository root."
            npm ci
            npm run build
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
